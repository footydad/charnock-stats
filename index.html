<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Our Team's Season Stats">
<meta property="og:description" content="Click to see the latest goals and assists!">
<meta property="og:image" content="preview.jpg">
<meta property="og:type" content="website">
<title>Charnock Ridgeway U13 Blacks · 2026/27</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── THEME: clean modern app — dark crimson header, slate body ── */
:root{
  --bg:#f0f2f5;
  --s1:#ffffff;
  --s2:#f4f6f9;
  --s3:#e8ecf1;
  --bd:#dde2ea;
  --acc:#9b1c2e;
  --acc2:#c4263b;
  --gold:#8a6500;
  --goldlt:#fef9e7;
  --muted:#7a8499;
  --text:#1e2535;
  --textlt:#4a5568;
  --win:#15803d;
  --winlt:#dcfce7;
  --draw:#92400e;
  --drawlt:#fef9c3;
  --loss:#b91c1c;
  --losslt:#fee2e2;
  --blue:#2563eb;
  --bluelt:#dbeafe;
  --purple:#7c3aed;
  --purplelt:#ede9fe;
  --teal:#0d9488;
  --teallt:#ccfbf1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px;}

/* ── HEADER: stays dark/crimson ── */
header{
  background:linear-gradient(150deg,#1c0a0e 0%,#2e0d14 50%,#1a0a0c 100%);
  border-bottom:3px solid var(--acc);
  padding:18px 16px 16px;
  position:relative;overflow:hidden;
}
header::after{content:'';position:absolute;top:-50px;right:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(155,28,46,.3),transparent 68%);pointer-events:none;}
.htop{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
h1{font-family:'Barlow Condensed',sans-serif;font-size:1.55em;font-weight:900;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;color:#fff;}
h1 span{color:#ff7b8a;}
.sbadge{display:inline-block;margin-top:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.65);font-size:.7em;padding:3px 10px;border-radius:20px;}

/* ── STATS STRIP ── */
.strip{display:flex;gap:7px;padding:11px 14px;background:var(--s1);border-bottom:1px solid var(--bd);overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.strip::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;text-align:center;}
.pill .n{font-family:'Barlow Condensed',sans-serif;font-size:1.5em;font-weight:800;line-height:1;color:var(--text);}
.pill .l{font-size:.6em;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em;}
.nw{color:var(--win)!important;}.nd{color:var(--gold)!important;}.nl{color:var(--loss)!important;}.nb{color:var(--acc)!important;}

/* ── COMPETITION FILTER ── */
.cmpbar{display:flex;gap:6px;padding:8px 14px;background:var(--s1);border-bottom:1px solid var(--bd);}
.cmpbtn{flex:1;padding:7px 8px;border:1.5px solid var(--bd);border-radius:8px;background:var(--s2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.9em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .18s;text-align:center;}
.cmpbtn.act{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.2);}
.cmpbtn:hover:not(.act){border-color:var(--blue);color:var(--blue);}

/* ── TABS ── */
.tabs{display:flex;background:var(--s1);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:20;overflow-x:auto;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.tabs::-webkit-scrollbar{display:none;}
.tb{flex:1;min-width:60px;padding:11px 4px;border:none;background:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.88em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.tb.act{color:var(--blue);border-bottom-color:var(--blue);}
.tb:hover:not(.act){color:var(--text);}
.pnl{display:none;padding:14px 14px 50px;}
.pnl.act{display:block;}

/* ── CUP FINAL BANNER ── */
.finalban{background:linear-gradient(135deg,#1c0a0e,#3a1220);border:1.5px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:13px;position:relative;overflow:hidden;}
.finalban::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at right center,rgba(196,38,59,.2),transparent 60%);}
.fbtop{font-family:'Barlow Condensed',sans-serif;font-size:.72em;font-weight:700;color:#ff7b8a;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px;position:relative;}
.fbttl{font-family:'Barlow Condensed',sans-serif;font-size:1.45em;font-weight:900;text-transform:uppercase;color:#fff;line-height:1.1;margin-bottom:5px;position:relative;}
.fbsub{font-size:.78em;color:rgba(255,255,255,.6);line-height:1.5;position:relative;}
.fbsub strong{color:rgba(255,255,255,.9);}

/* ── MATCH CARDS ── */
.mc{background:var(--s1);border:1px solid var(--bd);border-radius:10px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.mc:hover{border-color:#b8afa8;}
.mh{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none;}
.rb{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88em;flex-shrink:0;}
.rbW{background:var(--winlt);color:var(--win);border:1px solid #bbf7d0;}
.rbD{background:var(--drawlt);color:var(--draw);border:1px solid #fde68a;}
.rbL{background:var(--losslt);color:var(--loss);border:1px solid #fecaca;}
.mi{flex:1;min-width:0;}
.mo{font-weight:600;font-size:.9em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mm{font-size:.7em;color:var(--muted);margin-top:2px;}
.vt{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.8em;font-weight:600;margin-right:3px;}
.vH{background:var(--teallt);color:var(--teal);}
.vA{background:var(--drawlt);color:var(--draw);}
.vN{background:var(--bluelt);color:var(--blue);}
.ctag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.78em;font-weight:700;background:var(--purplelt);color:var(--purple);margin-right:3px;}
.msco{font-family:'Barlow Condensed',sans-serif;font-size:1.3em;font-weight:800;flex-shrink:0;}
.scW{color:var(--win);}.scD{color:var(--draw);}.scL{color:var(--loss);}
.ex{color:var(--muted);font-size:.65em;margin-left:6px;transition:transform .2s;display:inline-block;}
.mc.open .ex{transform:rotate(180deg);}
.mgp{display:none;padding:4px 13px 12px;border-top:1px solid var(--bd);background:var(--s2);}
.mc.open .mgp{display:block;}
.ng{font-size:.8em;color:var(--muted);padding:8px 0 2px;font-style:italic;}
.gr{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:.82em;}
.gr:last-child{border-bottom:none;}
.gmin{width:30px;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--blue);font-size:.9em;flex-shrink:0;}
.gs{font-weight:600;color:var(--text);flex:1;}
.ga{color:var(--muted);font-size:.85em;}
.gnote{background:var(--drawlt);color:var(--draw);font-size:.7em;padding:1px 5px;border-radius:3px;margin-left:2px;}

/* ── PLAYER FILTER BUTTONS ── */
.frow{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.frow+.frow{margin-bottom:12px;}
.fb{padding:5px 13px;border-radius:20px;border:1.5px solid var(--bd);background:var(--s2);color:var(--textlt);font-size:.76em;font-weight:600;cursor:pointer;transition:all .18s;}
.fb:hover{border-color:var(--blue);color:var(--blue);}
.fa{background:var(--blue);color:#fff!important;border-color:var(--blue)!important;}
.fb2{background:var(--gold);color:#fff!important;border-color:var(--gold)!important;}
.fb3{background:var(--purple);color:#fff!important;border-color:var(--purple)!important;}
.fb4{background:var(--blue);color:#fff!important;border-color:var(--blue)!important;}

/* ── SECTION HEADERS ── */
.shd{font-family:'Barlow Condensed',sans-serif;font-size:.82em;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid var(--bd);}
.sechd{font-family:'Barlow Condensed',sans-serif;font-size:.95em;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--bd);}
.sechd:first-child{border-top:none;margin-top:0;padding-top:0;}

/* ── PLAYER LEADERBOARD ── */
.pr{display:flex;align-items:center;gap:9px;background:var(--s1);border:1.5px solid var(--bd);border-radius:9px;padding:9px 13px;margin-bottom:6px;transition:border-color .15s,box-shadow .15s;}
.pr:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.1);}
.prk{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1em;width:24px;flex-shrink:0;text-align:center;}
.r1{color:#b8860b;}.r2{color:#6b7280;}.r3{color:#92400e;}.r0{color:var(--muted);}
.pnm{font-weight:600;font-size:.9em;width:66px;flex-shrink:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;}
.pnm:hover{color:var(--purple);}
.pbw{flex:1;}
.pb{height:8px;border-radius:5px;width:0;transition:width .85s cubic-bezier(.22,1,.36,1);}
.pbg{background:linear-gradient(90deg,var(--blue),var(--purple));}
.pba{background:linear-gradient(90deg,#7a5500,var(--gold));}
.pbc{background:linear-gradient(90deg,var(--teal),var(--blue));}
.pbpm{background:linear-gradient(90deg,var(--purple),#db2777);}
.pbpr{background:linear-gradient(90deg,var(--purple),var(--teal));}
.ppr{display:flex;align-items:center;gap:9px;background:var(--s1);border:1.5px solid var(--bd);border-radius:9px;padding:9px 13px;margin-bottom:6px;}
.ppr .ppnm{font-weight:600;font-size:.85em;flex:0 0 138px;color:var(--text);line-height:1.25;}
.ppr .ppnm .ppsep{color:var(--muted);font-weight:400;margin:0 3px;}
.pv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4em;width:36px;text-align:right;color:var(--text);}
.bkd{font-size:.65em;color:var(--muted);width:82px;text-align:right;flex-shrink:0;line-height:1.4;}

/* ── SITUATIONS ── */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.sc{background:var(--s1);border:1.5px solid var(--bd);border-radius:10px;padding:12px 10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.sc .stv{font-family:'Barlow Condensed',sans-serif;font-size:2.2em;font-weight:900;line-height:1;color:var(--text);}
.sc .stl{font-size:.67em;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.sc .sts{font-size:.74em;margin-top:8px;line-height:1.6;}
.sc .stn{font-size:.68em;color:var(--muted);margin-top:5px;font-style:italic;line-height:1.4;}
.scW2{border-color:#86efac;background:#f0fdf4;}.scD2{border-color:#fde68a;background:#fffbeb;}.scL2{border-color:#fca5a5;background:#fff5f5;}
.tbrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.tbl{font-size:.76em;color:var(--textlt);width:50px;flex-shrink:0;font-weight:600;}
.tbwrap{flex:1;background:var(--s3);border-radius:5px;height:23px;overflow:hidden;position:relative;border:1px solid var(--bd);}
.tbfill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:.73em;font-weight:700;color:#fff;}
.tbval{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.72em;color:var(--textlt);font-weight:600;}
.cbrow{display:flex;gap:10px;background:var(--s1);border:1.5px solid var(--bd);border-radius:9px;padding:10px 13px;margin-bottom:7px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.cbic{font-size:1.3em;flex-shrink:0;margin-top:1px;}
.cbtx{flex:1;font-size:.84em;}
.cbhd{font-weight:600;color:var(--text);margin-bottom:2px;}
.cbsb{color:var(--muted);font-size:.92em;line-height:1.45;}
.cbbg{font-size:.72em;padding:3px 8px;border-radius:5px;font-weight:700;white-space:nowrap;flex-shrink:0;align-self:center;}
.bgD{background:var(--drawlt);color:var(--draw);border:1px solid #fde68a;}
.bgW{background:var(--winlt);color:var(--win);border:1px solid #86efac;}

/* ── INSIGHTS GRID ── */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ic{background:var(--s1);border:1.5px solid var(--bd);border-radius:9px;padding:13px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ic .iv{font-family:'Barlow Condensed',sans-serif;font-size:2.2em;font-weight:900;color:var(--blue);line-height:1;}
.ic .il{font-size:.72em;color:var(--muted);margin-top:4px;line-height:1.35;}
.igl .iv{color:var(--gold);}.igp .iv{color:var(--purple);}.igw .iv{color:var(--win);}
.rrow{background:var(--s1);border:1.5px solid var(--bd);border-radius:9px;padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.rrow .rt{font-size:.86em;font-weight:500;color:var(--textlt);}
.rrow .rv{font-family:'Barlow Condensed',sans-serif;font-size:1.1em;font-weight:800;color:var(--text);}
.dyk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:.84em;line-height:1.55;color:var(--textlt);}
.dyk:last-child{border-bottom:none;}
.dyk em{color:var(--blue);font-style:normal;font-weight:600;}
.ctab{width:100%;border-collapse:collapse;font-size:.83em;}
.ctab th{text-align:center;padding:8px 8px;background:var(--s2);color:var(--muted);font-size:.78em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--bd);}
.ctab th:first-child{text-align:left;}
.ctab td{text-align:center;padding:9px 8px;border-bottom:1px solid var(--bd);color:var(--text);}
.ctab td:first-child{text-align:left;font-weight:600;}
.ctab tr:last-child td{border-bottom:none;}
.cW{color:var(--win);font-weight:700;}.cD{color:var(--draw);font-weight:700;}.cL{color:var(--loss);font-weight:700;}
.note{font-size:.73em;color:var(--muted);font-style:italic;margin:4px 0 12px;line-height:1.5;}
.sparse{background:var(--s2);border:1.5px solid var(--bd);border-radius:9px;padding:22px;text-align:center;font-size:.84em;color:var(--muted);margin:8px 0;line-height:1.7;}

/* ── LEAGUE TABLE ── */
.ltable{width:100%;border-collapse:collapse;font-size:.84em;}
.ltable th{text-align:center;padding:9px 6px;background:var(--s2);color:var(--muted);font-size:.75em;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-bottom:2px solid var(--bd);}
.ltable th:nth-child(2){text-align:left;}
.ltable td{text-align:center;padding:10px 6px;border-bottom:1px solid var(--bd);color:var(--text);}
.ltable td:nth-child(2){text-align:left;font-weight:600;}
.ltable tr:last-child td{border-bottom:none;}
.ltable .pos{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1em;color:var(--muted);}
.ltable .pts{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15em;color:var(--text);}
.ltable tr.charnock td{background:#eff6ff;color:var(--text);}
.ltable tr.charnock td:nth-child(2){color:var(--blue);font-weight:700;}
.ltable tr.charnock .pts{color:var(--blue);}
.ltable tr.charnock .pos{color:var(--blue);}
.ltable tr.charnock{border-left:3px solid var(--blue);}
.lnote{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;font-size:.78em;color:var(--textlt);line-height:1.6;margin-top:10px;}
.lnote strong{color:var(--text);}

/* ── PLAYER OVERLAY ── */
.ovlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(26,16,20,.55);backdrop-filter:blur(4px);}
.ovlay.show{display:flex;align-items:flex-end;}
.ovbox{background:var(--s1);border-radius:18px 18px 0 0;border-top:3px solid var(--blue);padding:0;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.18);}
.ovhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.ovname{font-family:'Barlow Condensed',sans-serif;font-size:1.5em;font-weight:900;text-transform:uppercase;color:var(--text);}
.ovsub{font-size:.78em;color:var(--muted);margin-top:2px;}
.ovcls{width:32px;height:32px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1em;color:var(--textlt);flex-shrink:0;}
.ovcls:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.ovbody{overflow-y:auto;padding:14px 18px 30px;flex:1;}
.ovtotals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.ovtc{background:var(--s2);border:1.5px solid var(--bd);border-radius:9px;padding:10px 12px;text-align:center;}
.ovtc .ovv{font-family:'Barlow Condensed',sans-serif;font-size:2em;font-weight:900;color:var(--acc);line-height:1;}
.ovtc .ovl{font-size:.68em;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.07em;}
.ovtc:last-child .ovv{color:var(--blue);}
.ovtable{width:100%;border-collapse:collapse;font-size:.82em;}
.ovtable th{text-align:left;padding:7px 8px;background:var(--s2);color:var(--muted);font-size:.74em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--bd);}
.ovtable th:last-child{text-align:right;}
.ovtable td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle;color:var(--text);}
.ovtable tr:last-child td{border-bottom:none;}
.ovtable tr:hover td{background:var(--s2);}
.ovact{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:700;padding:2px 7px;border-radius:4px;}
.ovg{background:var(--losslt);color:var(--acc);}
.ova{background:var(--drawlt);color:var(--draw);}
.ovptn{font-size:.82em;color:var(--muted);}
.ovres{font-family:'Barlow Condensed',sans-serif;font-size:.9em;font-weight:700;text-align:right;}
.novdata{font-size:.82em;color:var(--muted);font-style:italic;padding:16px 0;text-align:center;}
</style>
</head>
<body>

<!-- PLAYER OVERLAY -->
<div class="ovlay" id="overlay" onclick="closeOverlayIfBg(event)">
  <div class="ovbox" id="ovbox"></div>
</div>

<header>
  <div class="htop">
    <svg width="50" height="58" viewBox="0 0 52 60" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">
      <defs><clipPath id="sc"><path d="M2,2 H50 V42 L26,58 L2,42 Z"/></clipPath></defs>
      <g clip-path="url(#sc)">
        <rect x="0" y="0" width="9" height="60" fill="#9b1c2e"/>
        <rect x="9" y="0" width="8" height="60" fill="#0d0709"/>
        <rect x="17" y="0" width="9" height="60" fill="#9b1c2e"/>
        <rect x="26" y="0" width="8" height="60" fill="#0d0709"/>
        <rect x="34" y="0" width="9" height="60" fill="#9b1c2e"/>
        <rect x="43" y="0" width="9" height="60" fill="#0d0709"/>
        <rect x="0" y="3"  width="52" height="10" fill="rgba(5,3,5,.92)"/>
        <rect x="0" y="17" width="52" height="19" fill="rgba(5,3,5,.92)"/>
        <rect x="0" y="40" width="52" height="10" fill="rgba(5,3,5,.92)"/>
      </g>

      trs+=`<tr>
        <td style="color:var(--muted);font-size:.8em">${r.date.slice(0,6)}</td>
        <td style="font-weight:600;font-size:.85em">${r.opp}${cupBadge}</td>
        <td style="${vStyle};font-weight:700;font-size:.85em">${vl}</td>
        <td>${act}<br>${ptn}</td>
        <td class="ovres ${resCls}">${r.res} <span style="font-size:.8em;font-weight:500">${M.find(m=>m.id===r.mid)?.score||''}</span></td>
      </tr>`;
    });
  }
  document.getElementById('ovbox').innerHTML=`
    <div class="ovhead">
      <div>
        <div class="ovname">${name}</div>
        <div class="ovsub">${goals} goal${goals!==1?'s':''} · ${assists} assist${assists!==1?'s':''} · ${goals+assists} contributions</div>
      </div>
      <button class="ovcls" onclick="closeOverlay()">✕</button>
    </div>
    <div class="ovbody">
      <div class="ovtotals">
        <div class="ovtc"><div class="ovv">${goals}</div><div class="ovl">Goals</div></div>
        <div class="ovtc"><div class="ovv" style="color:var(--gold)">${assists}</div><div class="ovl">Assists</div></div>
        <div class="ovtc"><div class="ovv">${rate}</div><div class="ovl">Per Match</div></div>
      </div>
      <table class="ovtable">
        <thead><tr><th>Date</th><th>Opponent</th><th>V</th><th>Contribution</th><th style="text-align:right">Result</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
function closeOverlayIfBg(e){
  if(e.target===document.getElementById('overlay')) closeOverlay();
}

// ── SITUATIONS ────────────────────────────────────────────────────────────
function rSituations(){
  const ms=gm();
  const el=document.getElementById('pnl-situations');
  if(ms.length<2){
    el.innerHTML=`<div class="sparse">Not enough matches in this filter for situational analysis.<br>Switch to <strong>All</strong> or <strong>League</strong> to see the full picture.</div>`;
    return;
  }
  const htK=ms.filter(m=>m.htCh!==null);
  const htExcl=ms.filter(m=>m.htCh===null).map(m=>'M'+m.id);
  const lead=htK.filter(m=>htRes(m)==='W');
  const levl=htK.filter(m=>htRes(m)==='D');
  const trail=htK.filter(m=>htRes(m)==='L');
  const oc=(arr,r)=>arr.filter(m=>m.res===r).length;
  const sCard=(title,clr,arr,note)=>{
    const p=arr.length,w=oc(arr,'W'),d=oc(arr,'D'),l=oc(arr,'L');
    return`<div class="sc sc${clr}2"><div class="stv">${p}</div><div class="stl">${title}</div><div class="sts"><span style="color:var(--win)">W${w}</span> <span style="color:var(--draw)">D${d}</span> <span style="color:var(--loss)">L${l}</span></div><div class="stn">${note}</div></div>`;
  };
  const bands={b1:0,b2:0,b3:0,b4:0};
  ms.forEach(m=>m.goals.forEach(g=>{if(g.min==null)return;if(g.min<=E1)bands.b1++;else if(g.min<=E2)bands.b2++;else if(g.min<=E3)bands.b3++;else bands.b4++;}));
  const tot=bands.b1+bands.b2+bands.b3+bands.b4;
  const mxb=Math.max(...Object.values(bands))||1;
  const tRow=(l,c,clr)=>{const p=Math.round(c/mxb*100);const pp=tot>0?Math.round(c/tot*100):0;return`<div class="tbrow"><div class="tbl">${l}</div><div class="tbwrap"><div class="tbfill" data-w="${p}" style="width:0;background:${clr}">${c} goals</div><div class="tbval">${pp}%</div></div></div>`;};
  let h1g=0,h2g=0,ug=0;
  ms.forEach(m=>m.goals.forEach(g=>{if(g.min==null)ug++;else if(g.min<=HB)h1g++;else h2g++;}));
  const cbHtml=ms.filter(m=>m.comeback).map(m=>{
    const d=m.cbDesc||`Came from behind to ${m.res==='W'?'win':'draw'} ${m.score}`;
    return`<div class="cbrow"><div class="cbic">🔄</div><div class="cbtx"><div class="cbhd">vs ${m.opp} · ${m.date}</div><div class="cbsb">${d}</div></div><div class="cbbg bg${m.res==='W'?'W':'D'}">${m.res==='W'?'W':'D'} ${m.score}</div></div>`;
  }).join('');
  const hlHtml=ms.filter(m=>m.htLL).map(m=>`<div class="cbrow"><div class="cbic">😬</div><div class="cbtx"><div class="cbhd">vs ${m.opp} · ${m.date}</div><div class="cbsb">${m.htllDesc||`Led ${m.htCh}–${m.htOpp} at half time but could not hold on`}</div></div><div class="cbbg bgD">D ${m.score}</div></div>`).join('');
  el.innerHTML=`
    <div class="sechd">Half-Time Results</div>
    <div class="cards3">
      ${sCard('Leading at HT','W',lead,lead.length&&oc(lead,'L')===0?'Never lost when ahead at HT':'')}
      ${sCard('Level at HT','D',levl,levl.length?`Won ${oc(levl,'W')} from level`:'')}
      ${sCard('Trailing at HT','L',trail,trail.length?`Fought back for ${oc(trail,'W')+oc(trail,'D')} result(s)`:'')}
    </div>
    <div class="note">Based on ~${HB}-min half boundary.${htExcl.length?` ${htExcl.join(', ')} excluded (HT unknown or voided).`:''}</div>
    <div class="sechd">Comeback Matches</div>
    ${cbHtml||'<div class="note">No comeback matches in this filter.</div>'}
    <div class="sechd">HT Lead Dropped</div>
    ${hlHtml||'<div class="note">No dropped HT leads in this filter.</div>'}
    <div class="sechd">Goal Timing</div>
    <div id="tbars">
      ${tRow(`0–${E1}'`,  bands.b1,'linear-gradient(90deg,#7f1d1d,#9b1c2e)')}
      ${tRow(`${E1+1}–${E2}'`, bands.b2,'linear-gradient(90deg,#9b1c2e,#c4263b)')}
      ${tRow(`${E2+1}–${E3}'`, bands.b3,'linear-gradient(90deg,#c4263b,#b8860b)')}
      ${tRow(`${E3+1}'+`,   bands.b4,'linear-gradient(90deg,#b8860b,#d97706)')}
    </div>
    <div class="note" style="margin-top:6px">${bands.b4} goals after ${E3}' vs ${bands.b1} in the opening ${E1}'${bands.b4>bands.b1?' — scoring rate builds as games progress':''}.</div>
    <div class="sechd">1st Half vs 2nd Half</div>
    <div class="cards3" style="grid-template-columns:1fr 1fr">
      <div class="sc scW2"><div class="stv">${h1g}</div><div class="stl">1st Half Goals</div><div class="stn">Minute ≤ ${HB}'</div></div>
      <div class="sc scD2"><div class="stv">${h2g}</div><div class="stl">2nd Half Goals</div><div class="stn">Minute &gt; ${HB}'</div></div>
    </div>
    <div class="note">${ug} goal(s) with unrecorded minute excluded from half split.</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('.tbfill[data-w]').forEach(b=>{b.style.width=b.dataset.w+'%';});}));
}

// ── INSIGHTS ──────────────────────────────────────────────────────────────
function rInsights(){
  const ms=gm();
  const el=document.getElementById('pnl-insights');
  if(ms.length<2){
    el.innerHTML=`<div class="sparse">Not enough matches in this filter for insight analysis.<br>Switch to <strong>All</strong> or <strong>League</strong> to see the full picture.</div>`;
    return;
  }
  const realMs=ms.filter(m=>!m.walkover);
  const cs=realMs.filter(m=>m.score.split('-')[1]==='0');
  const hM=realMs.filter(m=>m.venue==='H'),aM=realMs.filter(m=>m.venue==='A');
  const vs=(arr,r)=>arr.filter(m=>m.res===r).length;
  const gfn=arr=>arr.reduce((s,m)=>s+parseInt(m.score),0);
  const gan=arr=>arr.reduce((s,m)=>s+parseInt(m.score.split('-')[1]),0);
  let mxS=0,mxWin=null,mxL=0,mxLoss=null;
  realMs.forEach(m=>{const[cf,ca]=m.score.split('-').map(Number);if(m.res==='W'&&cf-ca>mxS){mxS=cf-ca;mxWin=m;}if(m.res==='L'&&ca-cf>mxL){mxL=ca-cf;mxLoss=m;}});
  const vsOpp={};ms.forEach(m=>m.goals.forEach(g=>{if(!vsOpp[m.opp])vsOpp[m.opp]={};vsOpp[m.opp][g.s]=(vsOpp[m.opp][g.s]||0)+1;}));
  const oppRows=Object.entries(vsOpp).map(([o,sc])=>{const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];return`<div class="rrow"><div class="rt">vs ${o}</div><div class="rv">${top[0]} (${top[1]})</div></div>`;}).join('');
  const last5=realMs.slice(-5).map(m=>{
    const clr=m.res==='W'?'var(--win)':m.res==='D'?'var(--draw)':'var(--loss)';
    const bg=m.res==='W'?'var(--winlt)':m.res==='D'?'var(--drawlt)':'var(--losslt)';
    return`<span style="display:inline-flex;width:30px;height:30px;border-radius:6px;background:${bg};color:${clr};border:1.5px solid ${clr};font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95em;align-items:center;justify-content:center;margin-right:5px">${m.res}</span>`;
  }).join('');
  let maxSt=0,curSt2=0,cSt=0;
  realMs.forEach(m=>{if(m.res==='W'){curSt2++;maxSt=Math.max(maxSt,curSt2);}else curSt2=0;});
  for(let i=realMs.length-1;i>=0;i--){if(realMs[i].res==='W')cSt++;else break;}
  const pHA={};ms.forEach(m=>m.goals.forEach(g=>{if(!pHA[g.s])pHA[g.s]={H:0,A:0,N:0};pHA[g.s][m.venue]=(pHA[g.s][m.venue]||0)+1;}));
  const haRows=Object.entries(pHA).sort((a,b)=>(b[1].H+b[1].A+b[1].N)-(a[1].H+a[1].A+a[1].N))
    .map(([p,c])=>`<div class="rrow"><div class="rt">${p}</div><div class="rv" style="font-size:.95em"><span style="color:var(--teal)">H:${c.H||0}</span> &ensp;<span style="color:var(--draw)">A:${c.A||0}</span>${(c.N||0)>0?` &ensp;<span style="color:var(--blue)">N:${c.N}</span>`:''}</div></div>`).join('');
  const allGs=ms.flatMap(m=>m.goals);
  const totalDocGoals=allGs.length;
  const scorersAll=cG(ms,null,null), assistsAll=cA(ms,null,null);
  const ts1=scorersAll[0]||null, ts2=scorersAll[1]||null, ta1=assistsAll[0]||null;
  const halfProfile=p=>{const tg=allGs.filter(g=>g.s===p&&g.min!==null);const h1=tg.filter(g=>g.min<=HB).length;return{known:tg.length,h1,h2:tg.length-h1};};
  const htExclI=ms.filter(m=>m.htCh===null).map(m=>'M'+m.id);
  const totalLosses=ms.filter(m=>m.res==='L').length;
  const homeLosses=vs(hM,'L'),awayLosses=vs(aM,'L');
  const wMs=realMs.filter(m=>m.res==='W'),lMs=realMs.filter(m=>m.res==='L');
  const avgGFW=wMs.length?(wMs.reduce((s,m)=>s+parseInt(m.score),0)/wMs.length).toFixed(1):'—';
  const avgGAW=wMs.length?(wMs.reduce((s,m)=>s+parseInt(m.score.split('-')[1]),0)/wMs.length).toFixed(1):'—';
  const avgGFL=lMs.length?(lMs.reduce((s,m)=>s+parseInt(m.score),0)/lMs.length).toFixed(1):'—';
  const avgGAL=lMs.length?(lMs.reduce((s,m)=>s+parseInt(m.score.split('-')[1]),0)/lMs.length).toFixed(1):'—';
  const htKnownM=ms.filter(m=>m.htCh!==null);
  const htLeadM=htKnownM.filter(m=>m.htCh>m.htOpp);
  const htLeadW=htLeadM.filter(m=>m.res==='W').length;
  const htLeadD=htLeadM.filter(m=>m.res==='D').length;
  const maxCG=realMs.length?Math.max(...realMs.map(m=>+m.score.split('-')[0])):0;
  const maxCGm=realMs.find(m=>+m.score.split('-')[0]===maxCG);
  el.innerHTML=`
    <div class="sechd">Current Form (Last 5)</div>
    <div style="margin-bottom:14px">${last5}</div>
    <div class="igrid">
      <div class="ic igw"><div class="iv">${cSt}</div><div class="il">Current winning streak</div></div>
      <div class="ic igl"><div class="iv">${maxSt}</div><div class="il">Longest win streak this season</div></div>
      <div class="ic"><div class="iv">${cs.length}</div><div class="il">Clean sheets</div></div>
      <div class="ic igp"><div class="iv">${ms.filter(m=>m.comeback).length}</div><div class="il">Comeback results</div></div>
    </div>
    <div class="sechd">Home vs Away</div>
    <table class="ctab">
      <thead><tr><th></th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th></tr></thead>
      <tbody>
        <tr><td>🏠 Home</td><td>${hM.length}</td><td class="cW">${vs(hM,'W')}</td><td class="cD">${vs(hM,'D')}</td><td class="cL">${vs(hM,'L')}</td><td style="color:var(--blue);font-weight:600">${gfn(hM)}</td><td style="color:var(--muted)">${gan(hM)}</td></tr>
        <tr><td>✈ Away</td><td>${aM.length}</td><td class="cW">${vs(aM,'W')}</td><td class="cD">${vs(aM,'D')}</td><td class="cL">${vs(aM,'L')}</td><td style="color:var(--blue);font-weight:600">${gfn(aM)}</td><td style="color:var(--muted)">${gan(aM)}</td></tr>
      </tbody>
    </table>
    <div class="note">${homeLosses} home loss · ${awayLosses} of ${totalLosses} losses have been away from home.</div>
    <div class="sechd">Goals by Venue (per player)</div>${haRows}
    <div class="sechd">Top Scorer vs Each Opponent</div>${oppRows||'<div class="note">No goals in this filter.</div>'}
    ${mxWin?`<div class="sechd">Season Records</div>
    <div class="rrow"><div class="rt">🏆 Biggest win</div><div class="rv">${mxWin.score} vs ${mxWin.opp}</div></div>
    ${mxLoss?`<div class="rrow"><div class="rt">💀 Heaviest defeat</div><div class="rv" style="color:var(--loss)">${mxLoss.score} vs ${mxLoss.opp}</div></div>`:''}
    <div class="rrow"><div class="rt">⚽ Most goals in a match</div><div class="rv">${maxCG} vs ${maxCGm?.opp}</div></div>
    <div class="rrow"><div class="rt">🧤 Clean sheets</div><div class="rv">${cs.length} — all wins</div></div>`:''}
    ${(()=>{
      const dyk=[];
      if(ts1){const hp=halfProfile(ts1[0]);if(hp.known>=4){const early=hp.h1>=hp.h2;dyk.push(`⚡<span><em>${ts1[0]} ${early?'is the first-half finisher':'strikes late'}</em> — ${early?hp.h1:hp.h2} of his ${hp.known} timed goals come ${early?`before ${HB}'`:`after ${HB}'`}.</span>`);}}
      if(htLeadM.length>=2&&htLeadM.filter(m=>m.res==='L').length===0)dyk.push(`🛡️<span>Charnock have <em>never lost when winning at half time</em> — ${htLeadW} win${htLeadW===1?'':'s'} and ${htLeadD} draw${htLeadD===1?'':'s'} from ${htLeadM.length} HT leads${htExclI.length?` (${htExclI.join(', ')} excluded — HT unknown or voided)`:''}.</span>`);
      const lateG=ms.reduce((s,m)=>s+m.goals.filter(g=>g.min!=null&&g.min>E3).length,0);
      const earlyG=ms.reduce((s,m)=>s+m.goals.filter(g=>g.min!=null&&g.min<=E1).length,0);
      if(lateG+earlyG>=5)dyk.push(`📈<span>${lateG>earlyG?'Scoring rate builds as games progress — ':''}<em>${lateG} goals after ${E3}'</em> vs ${earlyG} in the opening ${E1} minutes.</span>`);
      if(totalLosses>0)dyk.push(`🏠<span>Of Charnock's <em>${totalLosses} loss${totalLosses===1?'':'es'}</em> this season, <em>${homeLosses} came at home</em> and ${awayLosses} away.</span>`);
      if(ts1&&ts2&&totalDocGoals>0)dyk.push(`🤝<span>${ts1[0]} (${ts1[1]}) and ${ts2[0]} (${ts2[1]}) are the top two scorers, accounting for <em>${Math.round((ts1[1]+ts2[1])/totalDocGoals*100)}%</em> of all documented goals.</span>`);
      if(ta1){const taG=scorersAll.find(([p])=>p===ta1[0])?.[1]||0;const contrib=taG+ta1[1];dyk.push(`🎯<span>${ta1[0]} is the <em>top assister with ${ta1[1]} assist${ta1[1]===1?'':'s'}</em>, giving him <em>${contrib} total goal contributions</em> — involved in ${totalDocGoals>0?Math.round(contrib/totalDocGoals*100):0}% of all documented goals.</span>`);}
      if(wMs.length&&lMs.length)dyk.push(`📉<span>In losses, Charnock average just <em>${avgGFL} goals</em> and concede ${avgGAL}. In wins, they average <em>${avgGFW} goals</em> and concede just ${avgGAW}.</span>`);
      return dyk.length?`<div class="sechd">Did You Know?</div><div>${dyk.map(d=>`<div class="dyk">${d}</div>`).join('')}</div>`:'';
    })()}`;
}

// ── LEAGUE TABLE ──────────────────────────────────────────────────────────
function rTable(){
  const rows=LTABLE.map(t=>{
    const cls=t.us?'charnock':'';
    const posLbl=t.pos===1?'🥇':t.pos===2?'🥈':t.pos===3?'🥉':t.pos;
    return`<tr class="${cls}">
      <td class="pos">${posLbl}</td>
      <td>${t.team}${t.us?' ◀':''}</td>
      <td>${t.P}</td>
      <td class="cW">${t.W}</td>
      <td class="cD">${t.D}</td>
      <td class="cL">${t.L}</td>
      <td class="pts">${t.pts}</td>
    </tr>`;
  }).join('');
  document.getElementById('pnl-table').innerHTML=`
    <div class="sechd" style="margin-top:0;padding-top:0;border-top:none">U13 - K Division (Sheffield & District Junior Sunday League) Standings</div>
    <table class="ltable">
      <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="lnote">Standings · 22 Nov 2026 (FA Full-Time, U13 - K Division). Charnock 5th on 13 pts (P8 W4 D1 L3).</div>`;
}

// ── COMPETITION FILTER ────────────────────────────────────────────────────
function setCmp(c,btn){
  curComp=c;
  document.querySelectorAll('.cmpbtn').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  rStrip();rMatches();rP();rSituations();rInsights();
  // Table is static — no need to re-render
}

// ── TAB SWITCH ────────────────────────────────────────────────────────────
function sw(id,btn){
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('act'));
  document.getElementById('pnl-'+id).classList.add('act');
  btn.classList.add('act');
  if(id==='players'){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('#pnl-players .pb[data-p]').forEach(b=>{b.style.width=b.dataset.p+'%';});}));}
}

// ── INIT ──────────────────────────────────────────────────────────────────
rStrip();rMatches();rP();rSituations();rInsights();rTable();
